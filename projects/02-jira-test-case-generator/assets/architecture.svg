<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Inter, system-ui, sans-serif">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <radialGradient id="glowT" cx="88%" cy="80%" r="45%"><stop offset="0" stop-color="#14B8A6" stop-opacity="0.26"/><stop offset="1" stop-color="#14B8A6" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="8%" cy="12%" r="40%"><stop offset="0" stop-color="#3B82F6" stop-opacity="0.25"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5EEAD4"/></marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FCD34D"/></marker>
  </defs>

  <rect width="1200" height="675" fill="#0B1530"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <rect width="1200" height="675" fill="url(#glowT)"/>
  <rect width="1200" height="675" fill="url(#glowB)"/>

  <text x="60" y="78" fill="#94A3B8" font-size="18" font-weight="600" letter-spacing="5">AI WORKFLOW AUTOMATION · QA · n8n</text>
  <text x="60" y="132" fill="#FFFFFF" font-size="46" font-weight="800">Jira Test-Case Generator</text>
  <text x="60" y="172" fill="#5EEAD4" font-size="22" font-weight="600">User story in · reviewed, traceable test cases out</text>

  <!-- Inputs -->
  <g font-size="15" font-weight="700" text-anchor="middle">
    <rect x="60" y="232" width="150" height="56" rx="12" fill="#111E40" stroke="#3B82F6"/>
    <text x="135" y="257" fill="#FFFFFF">Jira story</text>
    <text x="135" y="276" fill="#94A3B8" font-size="12" font-weight="500">label ai-test-gen</text>
    <rect x="60" y="302" width="150" height="56" rx="12" fill="#111E40" stroke="#3B82F6"/>
    <text x="135" y="327" fill="#FFFFFF">Web form</text>
    <text x="135" y="346" fill="#94A3B8" font-size="12" font-weight="500">key or pasted story</text>
    <rect x="60" y="372" width="150" height="56" rx="12" fill="#111E40" stroke="#3B82F6"/>
    <text x="135" y="397" fill="#FFFFFF">REST API</text>
    <text x="135" y="416" fill="#94A3B8" font-size="12" font-weight="500">CI / other tools</text>
  </g>

  <!-- Main flow -->
  <g font-size="17" font-weight="700" text-anchor="middle">
    <rect x="262" y="290" width="150" height="80" rx="14" fill="#111E40" stroke="#5EEAD4"/>
    <text x="337" y="324" fill="#FFFFFF">Normalize</text>
    <text x="337" y="346" fill="#94A3B8" font-size="12" font-weight="500">story + AC1…ACn</text>

    <rect x="462" y="280" width="200" height="100" rx="14" fill="#8B5CF6"/>
    <text x="562" y="318" fill="#FFFFFF">Claude Opus 5.5</text>
    <text x="562" y="341" fill="#EDE9FE" font-size="13" font-weight="500">senior-QA prompt</text>
    <text x="562" y="360" fill="#EDE9FE" font-size="13" font-weight="500">strict JSON schema</text>

    <rect x="712" y="285" width="170" height="90" rx="45" fill="#111E40" stroke="#FCD34D" stroke-width="2"/>
    <text x="797" y="322" fill="#FFFFFF">Quality</text>
    <text x="797" y="344" fill="#FFFFFF">gate</text>
  </g>
  <g stroke-width="2.5" fill="none">
    <path d="M210 260C238 260 236 318 254 322" stroke="#5EEAD4" marker-end="url(#arrow)"/>
    <path d="M210 330H254" stroke="#5EEAD4" marker-end="url(#arrow)"/>
    <path d="M210 400C238 400 236 342 254 338" stroke="#5EEAD4" marker-end="url(#arrow)"/>
    <path d="M412 330H454" stroke="#5EEAD4" marker-end="url(#arrow)"/>
    <path d="M662 330H704" stroke="#5EEAD4" marker-end="url(#arrow)"/>
    <path d="M882 310C910 310 905 252 932 252" stroke="#5EEAD4" marker-end="url(#arrow)"/>
    <path d="M882 330H932" stroke="#5EEAD4" marker-end="url(#arrow)"/>
    <path d="M882 350C910 350 905 408 932 408" stroke="#5EEAD4" marker-end="url(#arrow)"/>
  </g>

  <!-- Outputs -->
  <g font-size="15" font-weight="700">
    <rect x="940" y="222" width="210" height="60" rx="12" fill="#0F766E"/>
    <text x="958" y="248" fill="#FFFFFF">Jira comment + label</text>
    <text x="958" y="268" fill="#CCFBF1" font-size="12" font-weight="500">traceability table, full steps</text>
    <rect x="940" y="300" width="210" height="60" rx="12" fill="#111E40" stroke="#14B8A6" stroke-width="2"/>
    <text x="958" y="326" fill="#FFFFFF">Test library</text>
    <text x="958" y="346" fill="#94A3B8" font-size="12" font-weight="500">Postgres · traceability matrix</text>
    <rect x="940" y="378" width="210" height="60" rx="12" fill="#111E40" stroke="#14B8A6" stroke-width="2"/>
    <text x="958" y="404" fill="#FFFFFF">Results page / JSON</text>
    <text x="958" y="424" fill="#94A3B8" font-size="12" font-weight="500">+ CSV for Xray, Zephyr, TestRail</text>
  </g>

  <!-- Quality gate checks -->
  <g font-size="14" font-weight="600">
    <path d="M797 375V470" stroke="#FCD34D" stroke-width="2" stroke-dasharray="5 5" fill="none" marker-end="url(#arrowA)"/>
    <rect x="560" y="478" width="474" height="58" rx="12" fill="#111E40" stroke="#FCD34D" stroke-opacity="0.6"/>
    <text x="582" y="503" fill="#FDE68A">Every criterion covered · no unknown refs · negative tests</text>
    <text x="582" y="523" fill="#94A3B8" font-size="13" font-weight="500">Vague story? → questions for the product owner, not invented tests</text>
  </g>

  <!-- Stat chips -->
  <g font-size="15" font-weight="700">
    <rect x="60" y="585" width="250" height="44" rx="22" fill="#14B8A6" fill-opacity="0.15" stroke="#14B8A6"/>
    <text x="185" y="613" fill="#5EEAD4" text-anchor="middle">100% AC coverage check</text>
    <rect x="326" y="585" width="268" height="44" rx="22" fill="#3B82F6" fill-opacity="0.15" stroke="#3B82F6"/>
    <text x="460" y="613" fill="#93C5FD" text-anchor="middle">Boundary + negative tests</text>
    <rect x="610" y="585" width="250" height="44" rx="22" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6"/>
    <text x="735" y="613" fill="#C4B5FD" text-anchor="middle">Injection-resistant</text>
    <rect x="876" y="585" width="274" height="44" rx="22" fill="#FCD34D" fill-opacity="0.12" stroke="#FCD34D"/>
    <text x="1013" y="613" fill="#FDE68A" text-anchor="middle">21-case evaluation suite</text>
  </g>
</svg>
