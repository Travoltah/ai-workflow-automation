# Self-hosted stack for KYC document review:
#   PostgreSQL (n8n storage + kyc)  +  n8n  +  intake service (file handling and checks, no AI)
# Start:  docker compose up -d --build      Stop:  docker compose stop      Wipe data:  docker compose down -v
# Specimen documents for the demo:  docker compose run --rm intake python /scripts/make_specimens.py /specimens

services:
  postgres:
    image: postgres:17-alpine
    container_name: kyc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro    # creates the kyc database, schema and policy settings
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.47.7
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/
      GENERIC_TIMEZONE: ${TIMEZONE:-Africa/Harare}
      TZ: ${TIMEZONE:-Africa/Harare}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PAYLOAD_SIZE_MAX: "64"                     # uploads arrive as base64 inside the request
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none          # ID images pass through the workflow: don't keep them
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

  intake:
    build: ./service
    container_name: kyc-intake
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/kyc
      N8N_PROCESS_URL: http://n8n:5678/webhook/kyc/process   # called after a password unlocks a file
      REVIEW_URL: http://localhost:${N8N_PORT:-5678}/webhook/kyc/review
    ports:
      - "${INTAKE_PORT:-8001}:8000"                  # the reviewer's browser posts passwords here, never to n8n
    volumes:
      - ./scripts:/scripts:ro
      - ./sample-documents:/specimens
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  n8n_data:
