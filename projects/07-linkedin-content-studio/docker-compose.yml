# Self-hosted stack for the LinkedIn Content Studio:
#   PostgreSQL (n8n storage)  +  n8n  +  mock LinkedIn API (for testing without a real account)
# The website (Next.js, with the admin Content Studio) runs separately: on Vercel, or `npm run dev` on this machine.
#
# Start:            docker compose up -d
# With the mock:    docker compose --profile test up -d --build
# Stop:             docker compose stop        Wipe data:  docker compose down -v

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.47.7
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/
      GENERIC_TIMEZONE: ${TIMEZONE:-America/New_York}
      TZ: ${TIMEZONE:-America/New_York}
      N8N_DIAGNOSTICS_ENABLED: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"          # reach a website running with `npm run dev` on this machine
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

  mock-linkedin:
    build: ./mock-linkedin
    profiles: ["test"]
    restart: unless-stopped
    environment:
      PUBLIC_URL: http://mock-linkedin:8000          # upload URLs it hands out must be reachable from n8n
    ports:
      - "${MOCK_LINKEDIN_PORT:-8010}:8000"

volumes:
  postgres_data:
  n8n_data:
