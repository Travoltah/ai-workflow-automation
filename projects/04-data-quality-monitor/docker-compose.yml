# Self-hosted stack for the AI data quality monitor:
#   PostgreSQL (n8n storage + contoso_dq: the monitored data and the monitor's tables)  +  n8n
#   + mock Jira  (optional: docker compose --profile demo up -d)
#   + Metabase   (optional dashboards: docker compose --profile dashboard up -d)
# Start:  docker compose up -d      Stop:  docker compose stop      Wipe data:  docker compose down -v

services:
  postgres:
    image: postgres:17-alpine
    container_name: dq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro    # creates contoso_dq, the schema and the rules
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.47.7
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/
      GENERIC_TIMEZONE: ${TIMEZONE:-America/Phoenix}
      TZ: ${TIMEZONE:-America/Phoenix}
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

  mock-jira:
    profiles: ["demo"]
    image: python:3.12-slim
    command: ["python", "-u", "/scripts/mock_jira.py", "--port", "8089"]
    volumes:
      - ./scripts:/scripts:ro
    ports:
      - "8089:8089"                 # http://localhost:8089/_state lists every ticket and comment

  metabase:
    profiles: ["dashboard"]
    image: metabase/metabase:v0.52.9
    ports:
      - "${METABASE_PORT:-3000}:3000"
    volumes:
      - metabase_data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db

volumes:
  postgres_data:
  n8n_data:
  metabase_data:
